<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桥梁结构监测与限行决策</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:980px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem;margin-right:.5rem}</style></head><body><h1>桥梁结构监测与限行决策</h1><p>融合传感、巡检、交通荷载和天气数据，生成限载限行或恢复建议</p><p>监测批次按有效时间窗合算：乱序到达旧批次不覆盖较新结论；限行/封闭必须绑定有效交通通告，通告修改或批次作废立即失效重算；读数中断按批次号续写。</p><button onclick="loadItems()">告警列表</button><button onclick="loadLive()">值班台实时口径</button><button onclick="loadNotices()">交通通告</button><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><script>
async function get(path){const r=await fetch(path,{headers:{'X-Actor':'demo','X-Role':'viewer'}});return JSON.stringify(await r.json(),null,2)}
function loadItems(){get('/api/items').then(t=>document.getElementById('out').textContent=t)}
function loadLive(){get('/api/items').then(async j=>{const items=JSON.parse(j).items;if(!items.length){document.getElementById('out').textContent='暂无告警';return}const live=await get('/api/items/'+items[0].id+'/live');document.getElementById('out').textContent=live})}
function loadNotices(){get('/api/notices').then(t=>document.getElementById('out').textContent=t)}
</script></body></html>
